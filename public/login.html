<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bungoma Pay | Secure Login</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{
  font-family:'Poppins',sans-serif;
  min-height:100vh;
  background:linear-gradient(135deg,#065f3b,#047857,#10b981);
  display:flex;justify-content:center;align-items:center;
  padding:20px;overflow:hidden;position:relative;
}
body::before{
  content:'';position:absolute;width:500px;height:500px;
  background:rgba(255,255,255,0.08);border-radius:50%;
  top:-150px;right:-150px;filter:blur(30px);
}
body::after{
  content:'';position:absolute;width:400px;height:400px;
  background:rgba(255,255,255,0.05);border-radius:50%;
  bottom:-120px;left:-120px;filter:blur(30px);
}
.login-container{position:relative;z-index:2;width:100%;max-width:430px;}
.card{
  background:rgba(255,255,255,0.96);
  backdrop-filter:blur(10px);
  padding:40px 35px;border-radius:32px;
  box-shadow:0 15px 50px rgba(0,0,0,0.2);
  animation:fadeIn 0.6s ease;
}
@keyframes fadeIn{from{opacity:0;transform:translateY(20px);}to{opacity:1;transform:translateY(0);}}
.logo{
  width:75px;height:75px;
  background:linear-gradient(135deg,#047857,#10b981);
  border-radius:21px;display:flex;align-items:center;justify-content:center;
  margin:0 auto 22px;box-shadow:0 8px 25px rgba(4,120,87,0.3);
}
.logo span{font-size:38px;color:white;font-weight:700;}
h1{text-align:center;font-size:31px;font-weight:700;color:#065f3b;margin-bottom:8px;}
.subtitle{
  text-align:center;color:#64748b;font-size:15px;
  margin-bottom:30px;line-height:1.6;
}
.form-group{margin-bottom:20px;}
label{display:block;margin-bottom:8px;font-size:14px;font-weight:600;color:#334155;}
.input-box{position:relative;}
.input-icon{
  position:absolute;left:18px;top:50%;transform:translateY(-50%);
  font-size:18px;opacity:0.6;
}
.input-box input{
  width:100%;padding:17px 18px 17px 50px;
  border-radius:18px;border:1.5px solid #cbd5e1;
  background:#f8fafc;font-size:15px;
  font-family:'Poppins',sans-serif;
  outline:none;transition:0.3s;
}
.input-box input:focus{
  border-color:#047857;background:white;
  box-shadow:0 0 0 4px rgba(4,120,87,0.12);
}
.login-btn{
  width:100%;padding:17px;border:none;border-radius:18px;
  background:linear-gradient(135deg,#047857,#059669);
  color:white;font-size:16px;font-weight:700;
  cursor:pointer;font-family:'Poppins',sans-serif;
  transition:0.3s;box-shadow:0 8px 20px rgba(5,150,105,0.3);
  letter-spacing:0.2px;
}
.login-btn:hover{transform:translateY(-2px);box-shadow:0 12px 25px rgba(5,150,105,0.4);}
.login-btn:active{transform:translateY(0);}
.login-btn:disabled{opacity:0.7;cursor:not-allowed;transform:none;}

/* Forgot password */
.forgot-link{
  display:block;text-align:center;margin-top:16px;
  font-size:13.5px;color:#047857;font-weight:600;
  cursor:pointer;text-decoration:underline;
  transition:color 0.2s;
}
.forgot-link:hover{color:#065f3b;}

.status{margin-top:18px;padding:14px 18px;border-radius:16px;font-size:14px;display:none;font-weight:500;align-items:center;gap:10px;}
.status.success{display:flex;background:#f0fdf4;color:#166534;border:1px solid #bbf7d0;}
.status.error{display:flex;background:#fef2f2;color:#991b1b;border:1px solid #fecaca;}
.status.loading{display:flex;background:#eff6ff;color:#1d4ed8;border:1px solid #bfdbfe;}
.spin{width:15px;height:15px;border:2px solid rgba(29,78,216,0.3);border-top-color:#1d4ed8;border-radius:50%;animation:spin 0.7s linear infinite;flex-shrink:0;}
@keyframes spin{to{transform:rotate(360deg);}}

.footer{margin-top:25px;text-align:center;font-size:13px;color:#64748b;line-height:1.8;}
.badge{
  display:inline-block;margin-top:12px;
  padding:8px 14px;background:#ecfdf5;color:#047857;
  border-radius:30px;font-size:12px;font-weight:700;
  letter-spacing:1px;
}

/* Reset modal */
.modal-overlay{
  position:fixed;inset:0;background:rgba(0,0,0,0.45);
  backdrop-filter:blur(4px);z-index:100;
  display:none;align-items:center;justify-content:center;padding:20px;
}
.modal-overlay.open{display:flex;animation:fadeIn 0.2s ease;}
.modal{
  background:white;border-radius:24px;padding:32px;
  width:100%;max-width:380px;
  box-shadow:0 20px 50px rgba(0,0,0,0.18);
  animation:fadeIn 0.25s ease;
}
.modal h3{font-size:18px;font-weight:700;color:#065f3b;margin-bottom:8px;}
.modal p{font-size:13.5px;color:#64748b;margin-bottom:20px;line-height:1.6;}
.modal input{
  width:100%;padding:14px 16px;border-radius:14px;
  border:1.5px solid #cbd5e1;background:#f8fafc;
  font-family:'Poppins',sans-serif;font-size:14px;
  outline:none;transition:0.3s;margin-bottom:16px;
}
.modal input:focus{border-color:#047857;background:white;box-shadow:0 0 0 3px rgba(4,120,87,0.1);}
.modal-btns{display:flex;gap:10px;}
.btn-reset{
  flex:1;padding:13px;border:none;border-radius:14px;
  background:linear-gradient(135deg,#047857,#059669);
  color:white;font-family:'Poppins',sans-serif;
  font-size:13.5px;font-weight:700;cursor:pointer;transition:0.25s;
}
.btn-reset:hover{transform:translateY(-1px);}
.btn-cancel{
  padding:13px 18px;border:1.5px solid #e2e8f0;border-radius:14px;
  background:white;color:#64748b;font-family:'Poppins',sans-serif;
  font-size:13.5px;font-weight:600;cursor:pointer;transition:0.25s;
}
.btn-cancel:hover{background:#f8fafc;}
#resetStatus{margin-top:14px;padding:12px 16px;border-radius:12px;font-size:13px;display:none;font-weight:500;}
#resetStatus.success{display:block;background:#f0fdf4;color:#166534;border:1px solid #bbf7d0;}
#resetStatus.error{display:block;background:#fef2f2;color:#991b1b;border:1px solid #fecaca;}

@media(max-width:500px){.card{padding:35px 25px;}.login-btn,.btn{font-size:15px;}}
</style>
</head>
<body>

<div class="login-container">
  <div class="card">
    <div class="logo"><span>💳</span></div>
    <h1>Bungoma Pay</h1>
    <p class="subtitle">Secure Revenue Collection Platform for Bungoma County Government</p>

    <div class="form-group">
      <label>Email Address</label>
      <div class="input-box">
        <div class="input-icon">👤</div>
        <input type="email" id="email" placeholder="Enter your email" autocomplete="email">
      </div>
    </div>

    <div class="form-group">
      <label>Password</label>
      <div class="input-box">
        <div class="input-icon">🔒</div>
        <input type="password" id="password" placeholder="Enter your password" autocomplete="current-password">
      </div>
    </div>

    <button class="login-btn" id="loginBtn">LOG IN TO SYSTEM</button>

    <span class="forgot-link" id="forgotLink">Forgot password?</span>

    <div id="status" class="status"></div>

    <div class="footer">
      Protected County Revenue System
      <div class="badge">🛡 SYSTEM SECURED &copy;Elphaz Shelby</div>
    </div>
  </div>
</div>

<!-- Forgot Password Modal -->
<div class="modal-overlay" id="resetModal">
  <div class="modal">
    <h3>🔑 Reset Password</h3>
    <p>Enter your email address and we'll send you a link to reset your password.</p>
    <input type="email" id="resetEmail" placeholder="Enter your email address">
    <div class="modal-btns">
      <button class="btn-reset" id="sendResetBtn">Send Reset Link</button>
      <button class="btn-cancel" id="cancelResetBtn">Cancel</button>
    </div>
    <div id="resetStatus"></div>
  </div>
</div>

<script type="module">
import { initializeApp }                                                  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged,
         sendPasswordResetEmail }                                         from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, getDoc }                                     from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* ── YOUR FIREBASE CONFIG ── Replace with your own ── */
const firebaseConfig = {
  apiKey:            "AIzaSyCWqMIaIVpXwi7Am2tFvy4Tq2PGtpYgp_M",
  authDomain:        "bungoma-pay.firebaseapp.com",
  projectId:         "bungoma-pay",
  storageBucket:     "bungoma-pay.firebasestorage.app",
  messagingSenderId: "1022710513801",
  appId:             "1:1022710513801:web:4cf8ee7c786e6c333cc658"
};

const app  = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db   = getFirestore(app);

const statusBox = document.getElementById('status');
const loginBtn  = document.getElementById('loginBtn');

function showStatus(msg, type) {
  statusBox.className = `status ${type}`;
  statusBox.style.display = 'flex';
  statusBox.innerHTML = type === 'loading'
    ? `<div class="spin"></div>${msg}`
    : msg;
}

// Auto-redirect if already logged in
onAuthStateChanged(auth, (user) => {
  if (user) window.location.href = '/index.html';
});

// Login
loginBtn.addEventListener('click', async () => {
  const email    = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value.trim();

  if (!email || !password) {
    showStatus('Please fill in all login fields.', 'error');
    return;
  }

  loginBtn.disabled   = true;
  loginBtn.textContent = 'Authenticating…';
  showStatus('Verifying credentials…', 'loading');

  try {
    const cred = await signInWithEmailAndPassword(auth, email, password);
    const user = cred.user;

    showStatus('Login successful! Redirecting…', 'success');

    const snap = await getDoc(doc(db, 'users', user.uid));
    const role = snap.exists() ? (snap.data().role || 'officer') : 'officer';

    setTimeout(() => {
      window.location.href = role === 'admin' ? '/admin.html' : '/index.html';
    }, 200);

  } catch (error) {
    let msg = 'Invalid credentials';
    if (error.code === 'auth/user-not-found')   msg = 'User not found';
    if (error.code === 'auth/wrong-password')   msg = 'Incorrect password';
    if (error.code === 'auth/invalid-email')    msg = 'Invalid email format';
    if (error.code === 'auth/too-many-requests') msg = 'Too many attempts. Try again later.';
    showStatus(msg, 'error');
    loginBtn.disabled    = false;
    loginBtn.textContent = 'LOG IN TO SYSTEM';
  }
});

document.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') loginBtn.click();
});

// ── Forgot Password ────────────────────────────────────────
const resetModal     = document.getElementById('resetModal');
const resetEmailInp  = document.getElementById('resetEmail');
const sendResetBtn   = document.getElementById('sendResetBtn');
const cancelResetBtn = document.getElementById('cancelResetBtn');
const resetStatus    = document.getElementById('resetStatus');

document.getElementById('forgotLink').addEventListener('click', () => {
  resetEmailInp.value = document.getElementById('email').value;
  resetStatus.className = '';
  resetStatus.textContent = '';
  resetModal.classList.add('open');
});

cancelResetBtn.addEventListener('click', () => resetModal.classList.remove('open'));
resetModal.addEventListener('click', (e) => { if (e.target === resetModal) resetModal.classList.remove('open'); });

sendResetBtn.addEventListener('click', async () => {
  const email = resetEmailInp.value.trim();
  if (!email) {
    resetStatus.className   = 'error';
    resetStatus.textContent = 'Please enter your email address.';
    return;
  }

  sendResetBtn.disabled   = true;
  sendResetBtn.textContent = 'Sending…';

  try {
    await sendPasswordResetEmail(auth, email);
    resetStatus.className   = 'success';
    resetStatus.textContent = '✅ Reset link sent! Check your email inbox.';
    sendResetBtn.textContent = 'Sent!';
  } catch (error) {
    resetStatus.className   = 'error';
    resetStatus.textContent = error.code === 'auth/user-not-found'
      ? 'No account found with that email.'
      : 'Error sending reset email. Try again.';
    sendResetBtn.disabled    = false;
    sendResetBtn.textContent = 'Send Reset Link';
  }
});
</script>
</body>
</html>
