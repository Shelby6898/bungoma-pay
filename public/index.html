<!DOCTYPE html>
<html>
<body>
<h1>Bungoma Pay v1.0</h1>
<p>Offline-First Revenue Collection</p>
<div id="status">Loading...</div>
<button onclick="pay()">LIPA SASA</button>
<div id="result"></div>
<script>
async function load(){
  const r=await fetch('/api/health');
  const d=await r.json();
  document.getElementById('status').innerText=`Status: ${d.status} | Total: ${d.total_payments}`
}
async function pay(){
  const r=await fetch('/api/pay',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({amount:1000,phone:'0712345678',service:'Parking'})});
  const d=await r.json();
  document.getElementById('result').innerText=d.success?'SUCCESS: '+d.ref:'FAILED';
  load()
}
load()
</script>
</body>
</html>
