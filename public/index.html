<!DOCTYPE html>
<html>
<body>
<h3>Bungoma Pay v1.1</h3>
<p>Offline-First Revenue Collection</p>
<div id="status">Loading...</div>
<br>
<input id="amount" type="number" placeholder="Amount KES">
<br><br>
<select id="service">
  <option>Market Fee</option>
  <option>Parking</option>
  <option>Business License</option>
  <option>Land Rate</option>
</select>
<br><br>
<input id="phone" placeholder="Phone Number">
<br><br>
<button onclick="pay()">LIPA SASA</button>
<br><br>
<div id="result"></div>
<script>
async function load(){
  const r = await fetch('/api/health')
  const d = await r.json()
  document.getElementById('status').innerText = `Status: ${d.status} | Total: KES ${d.total} | Count: ${d.count}`
}
async function pay(){
  const amount = document.getElementById('amount').value
  const service = document.getElementById('service').value  
  const phone = document.getElementById('phone').value
  
  if(!amount || amount <= 0) return alert('Enter valid amount')
  
  const r = await fetch('/api/pay', {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({amount: Number(amount), phone, service})
  })
  const d = await r.json()
  if(d.success){
    document.getElementById('result').innerText = `SUCCESS: ${d.ref} | KES ${d.amount} | ${service}`
    document.getElementById('amount').value = ''
    document.getElementById('phone').value = ''
    load()
  }
}
load()
</script>
</body>
</html>
